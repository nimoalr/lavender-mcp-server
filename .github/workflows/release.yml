name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -e "const fs=require('fs'); const match=/\\bversion\\s+['\"]([^'\"]+)['\"]/.exec(fs.readFileSync('fxmanifest.lua','utf8')); process.stdout.write(match?.[1] ?? '')")"
          tag="v${version}"
          commit="$(git rev-parse HEAD)"

          test "$version" = "$manifest_version" || {
            echo "package version $version does not match manifest version $manifest_version" >&2
            exit 1
          }

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          echo "release_exists=false" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "$tag^{commit}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            test "$tag_commit" = "$commit" || {
              echo "Tag $tag already points to $tag_commit, not release commit $commit." >&2
              echo "Bump the package and manifest versions before publishing another release." >&2
              exit 1
            }
          fi

      - name: Set up Node.js
        if: steps.version.outputs.release_exists == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.release_exists == 'false'
        run: npm ci

      - name: Verify source and dependencies
        if: steps.version.outputs.release_exists == 'false'
        run: |
          npm run verify
          npm audit --omit=dev --audit-level=moderate

      - name: Prepare release resource
        if: steps.version.outputs.release_exists == 'false'
        run: npm run package

      - name: Generate SPDX SBOM
        if: steps.version.outputs.release_exists == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: .release/lavender-mcp-server-${{ steps.version.outputs.tag }}.spdx.json
          upload-artifact: false

      - name: Create archives and checksums
        if: steps.version.outputs.release_exists == 'false'
        shell: bash
        working-directory: .release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip -qr "lavender-mcp-server-${RELEASE_TAG}.zip" lavender-mcp-server
          tar -czf "lavender-mcp-server-${RELEASE_TAG}.tar.gz" lavender-mcp-server
          sha256sum \
            "lavender-mcp-server-${RELEASE_TAG}.zip" \
            "lavender-mcp-server-${RELEASE_TAG}.tar.gz" \
            "lavender-mcp-server-${RELEASE_TAG}.spdx.json" \
            > SHA256SUMS

      - name: Publish GitHub release
        if: steps.version.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            ".release/lavender-mcp-server-${RELEASE_TAG}.zip" \
            ".release/lavender-mcp-server-${RELEASE_TAG}.tar.gz" \
            ".release/lavender-mcp-server-${RELEASE_TAG}.spdx.json" \
            ".release/SHA256SUMS" \
            --target "$RELEASE_COMMIT" \
            --generate-notes \
            --title "$RELEASE_TAG"
