name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: |
          npm run verify
          npm audit --omit=dev --audit-level=moderate

      - name: Prepare release resource
        run: npm run package

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: .release/lavender-mcp-server-${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Create archives and checksums
        shell: bash
        working-directory: .release
        run: |
          zip -qr "lavender-mcp-server-${GITHUB_REF_NAME}.zip" lavender-mcp-server
          tar -czf "lavender-mcp-server-${GITHUB_REF_NAME}.tar.gz" lavender-mcp-server
          sha256sum \
            "lavender-mcp-server-${GITHUB_REF_NAME}.zip" \
            "lavender-mcp-server-${GITHUB_REF_NAME}.tar.gz" \
            "lavender-mcp-server-${GITHUB_REF_NAME}.spdx.json" \
            > SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".release/lavender-mcp-server-${GITHUB_REF_NAME}.zip" \
            ".release/lavender-mcp-server-${GITHUB_REF_NAME}.tar.gz" \
            ".release/lavender-mcp-server-${GITHUB_REF_NAME}.spdx.json" \
            ".release/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
